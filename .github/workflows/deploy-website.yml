name: Deploy company website (zhesi-website)

# Static company website (repo: reed-wetland-website) hosted on
# Cloudflare Pages. Production domain: wetlandbirdwatching.com
# Manual trigger only — game deployment (deploy-cloudflare.yml) is separate.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-website.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        run: git clone --depth 1 https://github.com/zheyu-Julie-Liu/reed-wetland-website.git site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ebc829b59c08c144ed977e965c556c5a
        run: wrangler pages project create zhesi-website --production-branch=main 2>&1 | tee /tmp/cf_create.log || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ebc829b59c08c144ed977e965c556c5a
        run: |
          set -o pipefail
          wrangler pages deploy site --project-name=zhesi-website --branch=main --commit-dirty=true 2>&1 | tee /tmp/cf_deploy.log

      - name: Attach production domain (apex CNAME)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC=ebc829b59c08c144ed977e965c556c5a
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # 1) register custom domain on the Pages project (idempotent)
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"name":"wetlandbirdwatching.com"}' \
            "$API/accounts/$ACC/pages/projects/zhesi-website/domains" | head -c 300; echo
          # 2) zone id
          ZONE=$(curl -s -H "$AUTH" "$API/zones?name=wetlandbirdwatching.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['result'][0]['id'])")
          echo "zone=$ZONE"
          # 3) apex CNAME (flattened, proxied) — create only if absent
          EXISTS=$(curl -s -H "$AUTH" "$API/zones/$ZONE/dns_records?type=CNAME&name=wetlandbirdwatching.com" | python3 -c "import sys,json;print(len(json.load(sys.stdin)['result']))")
          if [ "$EXISTS" = "0" ]; then
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"wetlandbirdwatching.com","content":"zhesi-website.pages.dev","proxied":true}' \
              "$API/zones/$ZONE/dns_records" | head -c 300; echo
          else
            echo "apex CNAME already present, skip"
          fi
