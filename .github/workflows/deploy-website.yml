name: Deploy company website (zhesi-website)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-website.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        run: git clone --depth 1 https://github.com/zheyu-Julie-Liu/reed-wetland-website.git site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ebc829b59c08c144ed977e965c556c5a
        run: wrangler pages project create zhesi-website --production-branch=main 2>&1 | tee /tmp/cf_create.log || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ebc829b59c08c144ed977e965c556c5a
        run: |
          set -o pipefail
          wrangler pages deploy site --project-name=zhesi-website --branch=main --commit-dirty=true 2>&1 | tee /tmp/cf_deploy.log

      - name: Domain register (apex)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"wetlandbirdwatching.com"}' \
            "https://api.cloudflare.com/client/v4/accounts/ebc829b59c08c144ed977e965c556c5a/pages/projects/zhesi-website/domains" 2>&1 | tee /tmp/cf_domain.log || true

      - name: Domain zone lookup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=wetlandbirdwatching.com" 2>&1 | tee /tmp/cf_zone.log || true

      - name: Domain dns create (skip if present)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE=$(python3 -c "import json;d=json.load(open('/tmp/cf_zone.log'));r=d.get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$ZONE" ]; then echo "no zone id — token likely lacks Zone:Read"; exit 0; fi
          EXISTS=$(python3 -c "import json;d=json.load(open('/tmp/cf_zone.log'));print(len(d.get('result') or []))" 2>/dev/null || echo 0)
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"wetlandbirdwatching.com","content":"zhesi-website.pages.dev","proxied":true}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" 2>&1 | tee /tmp/cf_dns.log || true

      - name: Publish diagnostics (always)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q -b deploy-log
          git config user.email "bot@users.noreply.github.com"
          git config user.name "deploy-bot"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/zheyu-Julie-Liu/Reed-Bird-watching-simulator.git"
          {
            echo "# zhesi deploy diagnostics $(date -u +%FT%TZ)"
            echo "## create-project"; cat /tmp/cf_create.log 2>/dev/null || true
            echo "## deploy"; cat /tmp/cf_deploy.log 2>/dev/null || true
            echo "## domain-register"; cat /tmp/cf_domain.log 2>/dev/null || true
            echo "## zone-lookup"; cat /tmp/cf_zone.log 2>/dev/null | head -c 2000 || true
            echo; echo "## dns-create"; cat /tmp/cf_dns.log 2>/dev/null || true
          } > deploy.log
          git add deploy.log
          git commit -qm "diag"
          git push -qf origin deploy-log
